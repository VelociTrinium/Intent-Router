[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-router"
version = "0.2.0"
description = "Low-latency 4-class NLP intent router based on fine-tuned Qwen2.5-0.5B-Instruct for Ollama"
readme = "README.md"
authors = [{ name = "Intent Router Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "peft>=0.15.0",
    "safetensors>=0.4.0",
    "gguf>=0.16.0",
    "sentencepiece>=0.2.0",
    "PyYAML>=6.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "huggingface_hub>=0.25.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
